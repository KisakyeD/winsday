<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIP Football Predictions & Live Tips</title>

  <style>
    :root {
      --bg-dark: #0b0e14;
      --card-bg: #151a23;
      --accent-green: #00e676;
      --accent-red: #ff5252;
      --accent-gold: #ffd700;
      --accent-orange: #ff9100;
      --text-main: #f0f4f8;
      --text-muted: #8a99ad;
      --border-color: #232d3f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    /* Top Header & Navigation */
    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      position: relative;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title {
      font-size: 1.4rem;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
    }

    /* WhatsApp Button */
    .whatsapp-btn {
      background: #25d366;
      color: #fff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 10px rgba(37, 211, 102, 0.3);
      transition: transform 0.2s, background 0.2s;
    }

    .whatsapp-btn:hover {
      background: #20ba5a;
      transform: translateY(-1px);
    }

    .whatsapp-icon {
      width: 16px;
      height: 16px;
      fill: #fff;
    }

    /* Refresh Button */
    .refresh-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .refresh-btn:hover {
      background: var(--border-color);
      color: var(--accent-green);
    }

    .refresh-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      transition: transform 0.5s ease;
    }

    .refresh-btn.spinning svg {
      transform: rotate(360deg);
    }

    .badge-ai {
      background: linear-gradient(135deg, #00e676, #00b0ff);
      color: #000;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .hamburger-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 1.5rem;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .hamburger-btn:hover {
      background: var(--border-color);
    }

    /* Adsterra Banners */
    .adsterra-banner {
      display: block;
      background: linear-gradient(135deg, #ff9100, #ff5252);
      color: #000;
      text-align: center;
      padding: 14px 16px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.95rem;
      text-decoration: none;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(255, 145, 0, 0.4);
      cursor: pointer;
    }

    /* Navigation Drawer */
    .menu-drawer {
      position: fixed;
      top: 0;
      right: -320px;
      width: 290px;
      height: 100vh;
      background: #11151c;
      border-left: 1px solid var(--border-color);
      box-shadow: -5px 0 25px rgba(0,0,0,0.8);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      padding: 20px;
      transition: right 0.3s ease;
      overflow-y: auto;
    }

    .menu-drawer.open {
      right: 0;
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .drawer-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent-gold);
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .menu-item {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      padding: 12px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }

    .menu-item:hover, .menu-item.active {
      background: rgba(0, 230, 118, 0.15);
      border-color: var(--accent-green);
      color: var(--accent-green);
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.6);
      z-index: 999;
      display: none;
    }

    .overlay.active {
      display: block;
    }

    .live-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: var(--accent-green);
      border-radius: 50%;
      margin-right: 6px;
      box-shadow: 0 0 8px var(--accent-green);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    /* Mode Banner */
    .mode-banner {
      background: rgba(0, 230, 118, 0.1);
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
      padding: 10px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      font-weight: bold;
    }

    /* Date Navigation Slider */
    .date-nav-container {
      margin-bottom: 24px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px;
    }

    .date-slider {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding-bottom: 6px;
    }

    .date-slider::-webkit-scrollbar { height: 6px; }
    .date-slider::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }

    .date-btn {
      flex: 0 0 auto;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
    }

    .date-btn.active {
      background: var(--accent-green);
      color: #000;
      border-color: var(--accent-green);
      font-weight: bold;
    }

    .date-btn .day-label { font-size: 0.7rem; display: block; text-transform: uppercase; }
    .date-btn .date-num { font-size: 0.95rem; font-weight: bold; }

    /* Tickets Section */
    .tickets-wrapper {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .ticket-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      cursor: pointer;
    }

    .ticket-header {
      background: #1c2330;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .ticket-title { font-weight: bold; font-size: 1rem; }
    .total-odds { background: rgba(0, 230, 118, 0.15); color: var(--accent-green); padding: 4px 10px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; }

    .games-list { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .game-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: rgba(255, 255, 255, 0.02); border-radius: 8px; border-left: 3px solid var(--text-muted); }
    .game-details { display: flex; flex-direction: column; gap: 4px; }
    .teams { font-weight: 600; font-size: 0.95rem; }
    .league { font-size: 0.75rem; color: var(--text-muted); }
    .prediction { font-size: 0.85rem; color: var(--accent-green); font-weight: bold; }
    
    .game-score-box { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .score-badge { background: #1c2330; color: var(--accent-gold); padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 0.9rem; border: 1px solid var(--border-color); }
    .game-odds { font-size: 0.8rem; color: var(--text-muted); }

    .ticket-footer { padding: 12px 16px; background: #11151c; border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .status-badge { padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; }
    .status-PENDING { background: rgba(255, 255, 255, 0.1); color: var(--text-muted); }
    .status-WIN { background: rgba(0, 230, 118, 0.2); color: var(--accent-green); }
    .status-LOSS { background: rgba(255, 82, 82, 0.2); color: var(--accent-red); }

    .loading-box { text-align: center; padding: 40px; color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="overlay" id="overlay" onclick="toggleMenu(false)"></div>

  <!-- Navigation Drawer with Icons -->
  <div class="menu-drawer" id="menu-drawer">
    <div class="drawer-header">

          <span>Refresh</span>

    <!-- Top Ad Banner -->
    <a href="https://asiafilm.org/4/bfed8707da7edd1a593d3152bed94170" target="_blank" class="adsterra-banner">

      <div class="date-slider" id="date-slider"></div>

    <div class="tickets-wrapper" id="tickets-container">
      <div class="loading-box">Loading live data...</div>
    </div>

    <!-- Bottom Ad Banner -->
    <a href="https://asiafilm.org/4/bfed8707da7edd1a593d3152bed94170" target="_blank" class="adsterra-banner" style="margin-top: 25px;">
      CLAIM VIP BONUS & HIGH ODDS SLIPS HERE
    </a>

  <script>
    let currentDateKey = getFormattedDate(0);
    let currentCategory = "WINRATE_99";
    const adsterraUrl = "https://asiafilm.org/4/bfed8707da7edd1a593d3152bed94170";

    // GLOBAL CLICK REDIRECT: Opens Adsterra on any click across the page
    document.addEventListener("click", function(e) {
      if (e.target.closest('.menu-drawer') || e.target.closest('.date-slider') || e.target.closest('.whatsapp-btn') || e.target.closest('.refresh-btn') || e.target.tagName === 'A' || e.target.closest('button')) {
        return;
      }
      window.open(adsterraUrl, '_blank');
    });

    document.addEventListener("DOMContentLoaded", () => {
      buildDateSlider();
      loadCategoryData(currentDateKey);
    });

    function handleManualRefresh() {
      const btn = document.getElementById("refresh-btn");
      btn.classList.add("spinning");
      loadCategoryData(currentDateKey).finally(() => {
        setTimeout(() => btn.classList.remove("spinning"), 500);
      });
    }

    function toggleMenu(open) {
      const drawer = document.getElementById("menu-drawer");
      const overlay = document.getElementById("overlay");
      if (open) {
        drawer.classList.add("open");
        overlay.classList.add("active");
      } else {
        drawer.classList.remove("open");
        overlay.classList.remove("active");
      }
    }

    function switchCategory(cat) {
      currentCategory = cat;
      toggleMenu(false);

      document.querySelectorAll(".menu-item").forEach(el => el.classList.remove("active"));
      
      const banner = document.getElementById("mode-title");
      if (cat === "WINRATE_99") {
        document.getElementById("menu-winrate99").classList.add("active");
        banner.innerHTML = `<span class="live-dot"></span>Category: 🎯 99% Winrate Tips`;
      } else if (cat === "STANDARD") {
        document.getElementById("menu-standard").classList.add("active");
        banner.innerHTML = `<span class="live-dot"></span>Category: ⚽ Daily VIP Tickets`;
      } else if (cat === "SINGLE") {
        document.getElementById("menu-single").classList.add("active");
        banner.innerHTML = `<span class="live-dot"></span>Category: 📌 Daily Single Nap`;
      } else if (cat === "SINGLE_2") {
        document.getElementById("menu-single2").classList.add("active");
        banner.innerHTML = `<span class="live-dot"></span>Category: 🔥 Single Match Pick`;
      } else if (cat === "SINGLE_3") {
        document.getElementById("menu-single3").classList.add("active");
        banner.innerHTML = `<span class="live-dot"></span>Category: ⚡ Safe Combo Ticket`;
      } else {
        document.getElementById("menu-over15").classList.add("active");
        banner.innerHTML = `<span class="live-dot"></span>Category: 🚀 Over 1.5 Goals`;
      }

      loadCategoryData(currentDateKey);
    }

    function getFormattedDate(offsetDays) {
      const date = new Date();
      date.setDate(date.getDate() + offsetDays);
      return date.toISOString().split('T')[0];
    }

    function buildDateSlider() {
      const slider = document.getElementById("date-slider");
      slider.innerHTML = "";

      for (let i = -30; i <= 30; i++) {
        const dateObj = new Date();
        dateObj.setDate(dateObj.getDate() + i);
        
        const dateKey = dateObj.toISOString().split('T')[0];
        const dayName = dateObj.toLocaleDateString('en-US', { weekday: 'short' });
        const dayNum = dateObj.getDate();
        const monthName = dateObj.toLocaleDateString('en-US', { month: 'short' });

        const btn = document.createElement("button");
        btn.className = `date-btn ${i === 0 ? 'active' : ''}`;
        btn.id = `date-btn-${dateKey}`;
        btn.onclick = () => selectDate(dateKey);
        
        btn.innerHTML = `
          <span class="day-label">${i === 0 ? 'Today' : dayName}</span>
          <span class="date-num">${dayNum} ${monthName}</span>
        `;

        slider.appendChild(btn);
      }

      setTimeout(() => {
        const todayBtn = document.getElementById(`date-btn-${getFormattedDate(0)}`);
        if (todayBtn) {
          todayBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }
      }, 100);
    }

    function selectDate(dateKey) {
      currentDateKey = dateKey;
      document.querySelectorAll(".date-btn").forEach(b => b.classList.remove("active"));
      const activeBtn = document.getElementById(`date-btn-${dateKey}`);
      if (activeBtn) activeBtn.classList.add("active");

      loadCategoryData(dateKey);
    }

    async function loadCategoryData(dateKey) {
      const container = document.getElementById("tickets-container");
      container.innerHTML = `<div class="loading-box">Loading live data...</div>`;

      try {
        const formattedDateParam = dateKey.replace(/-/g, '');
        const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard?dates=${formattedDateParam}`);
        const data = await res.json();

        let events = data.events || [];

        if (events.length === 0) {
          container.innerHTML = `<div class="loading-box">No official football matches scheduled for ${dateKey}. Select another date above.</div>`;
          return;
        }

        let tickets = [];
        if (currentCategory === "WINRATE_99") {
          tickets = generate99WinrateTickets(events, dateKey);
        } else if (currentCategory === "SINGLE") {
          tickets = generateSingleTicket(events, dateKey, 0, "VIP Single Nap Ticket", "Over 1.5 Goals");
        } else if (currentCategory === "SINGLE_2") {
          tickets = generateSingleTicket(events, dateKey, 1, "Single Match Pick", "Double Chance (1X)");
        } else if (currentCategory === "SINGLE_3") {
          tickets = generateSingle3ComboTicket(events, dateKey);
        } else if (currentCategory === "OVER_1_5") {
          tickets = generateOver15Tickets(events, dateKey);
        } else {
          tickets = parseStandardTickets(events, dateKey);
        }

        renderTickets(tickets);

      } catch (err) {
        console.error("Failed to load live data:", err);
        container.innerHTML = `<div class="loading-box">Unable to connect to live match feed. Check internet connection.</div>`;
      }
    }

    function parseEvent(ev, dateKey, pickTypeOverride = null) {
      const comp = ev.competitions[0];
      const homeComp = comp.competitors.find(c => c.homeAway === 'home');
      const awayComp = comp.competitors.find(c => c.homeAway === 'away');
      const state = comp.status.type.state;

      const homeName = homeComp.team.shortDisplayName || homeComp.team.displayName;
      const awayName = awayComp.team.shortDisplayName || awayComp.team.displayName;

      const homeScore = (state === 'pre') ? '-' : (homeComp.score || '0');
      const awayScore = (state === 'pre') ? '-' : (awayComp.score || '0');

      const ultraSafePicks = ["Double Chance (1X)", "Over 1.5 Goals", "Double Chance (X2)"];
      let seed = (homeName + awayName + dateKey).length;
      const pick = pickTypeOverride || ultraSafePicks[seed % ultraSafePicks.length];

      let oddVal = (1.15 + ((seed * 2) % 15) / 100).toFixed(2);

      return {
        teams: `${homeName} vs ${awayName}`,
        league: ev.season && ev.season.slug ? ev.season.slug.toUpperCase().replace(/-/g, ' ') : "INTERNATIONAL",
        pick: pick,
        odd: oddVal,
        homeScore: homeScore,
        awayScore: awayScore,
        state: state
      };
    }

    function generate99WinrateTickets(events, dateKey) {
      let tickets = [];
      const win99Picks = ["Over 0.5 Goals", "Double Chance (1X)", "Over 1.5 Goals"];

      for (let tNum = 1; tNum <= 5; tNum++) {
        let legs = [];
        let runningOdds = 1.0;

        for (let legIdx = 0; legIdx < 2; legIdx++) {
          let eventIndex = ((tNum - 1) * 2 + legIdx) % events.length;
          let ev = events[eventIndex];

          const comp = ev.competitions[0];
          const homeComp = comp.competitors.find(c => c.homeAway === 'home');
          const awayComp = comp.competitors.find(c => c.homeAway === 'away');
          const state = comp.status.type.state;

          const homeName = homeComp.team.shortDisplayName || homeComp.team.displayName;
          const awayName = awayComp.team.shortDisplayName || awayComp.team.displayName;
          const homeScore = (state === 'pre') ? '-' : (homeComp.score || '0');
          const awayScore = (state === 'pre') ? '-' : (awayComp.score || '0');

          let seed = (homeName + awayName + dateKey + tNum + legIdx).length;
          const safePick = win99Picks[seed % win99Picks.length];
          let oddVal = (1.10 + ((seed * 2) % 12) / 100).toFixed(2);

          legs.push({
            teams: `${homeName} vs ${awayName}`,
            league: ev.season && ev.season.slug ? ev.season.slug.toUpperCase().replace(/-/g, ' ') : "INTERNATIONAL",
            pick: safePick,
            odd: oddVal,
            homeScore: homeScore,
            awayScore: awayScore,
            state: state
          });
          runningOdds *= parseFloat(oddVal);
        }

        tickets.push({
          name: `99% Winrate Ticket #${tNum}`,
          totalOdds: runningOdds.toFixed(2),
          games: legs
        });
      }

      return tickets;
    }

    function generateSingleTicket(events, dateKey, eventIndex, ticketName, pickType) {
      const ev = events[eventIndex % events.length];
      const game = parseEvent(ev, dateKey, pickType);
      return [{
        name: ticketName,
        totalOdds: game.odd,
        games: [game]
      }];
    }

    function generateSingle3ComboTicket(events, dateKey) {
      let games = [];
      let runningOdds = 1.0;
      const count = Math.min(3, events.length);

      const safeComboMarkets = [
        "Over 1.5 Goals",
        "Double Chance (1X)",
        "Double Chance (X2)"
      ];

      for (let i = 0; i < count; i++) {
        const ev = events[i];
        const comp = ev.competitions[0];
        const homeComp = comp.competitors.find(c => c.homeAway === 'home');
        const awayComp = comp.competitors.find(c => c.homeAway === 'away');
        const state = comp.status.type.state;

        const homeName = homeComp.team.shortDisplayName || homeComp.team.displayName;
        const awayName = awayComp.team.shortDisplayName || awayComp.team.displayName;
        const homeScore = (state === 'pre') ? '-' : (homeComp.score || '0');
        const awayScore = (state === 'pre') ? '-' : (awayComp.score || '0');

        let seed = (homeName + awayName + dateKey + i).length;
        const pick = safeComboMarkets[seed % safeComboMarkets.length];
        let oddVal = (1.18 + ((seed * 2) % 12) / 100).toFixed(2);

        games.push({
          teams: `${homeName} vs ${awayName}`,
          league: ev.season && ev.season.slug ? ev.season.slug.toUpperCase().replace(/-/g, ' ') : "INTERNATIONAL",
          pick: pick,
          odd: oddVal,
          homeScore: homeScore,
          awayScore: awayScore,
          state: state
        });
        runningOdds *= parseFloat(oddVal);
      }

      return [{
        name: "Safe Combo Ticket",
        totalOdds: runningOdds.toFixed(2),
        games: games
      }];
    }

    function generateOver15Tickets(events, dateKey) {
      const pool = events.map(ev => parseEvent(ev, dateKey, "Over 1.5 Goals"));
      let tickets = [];

      for (let tNum = 1; tNum <= 3; tNum++) {
        let legs = [];
        let runningOdds = 1.0;
        
        for (let legIdx = 0; legIdx < 2; legIdx++) {
          let poolIndex = ((tNum - 1) * 2 + legIdx) % pool.length;
          let game = pool[poolIndex];
          legs.push(game);
          runningOdds *= parseFloat(game.odd);
        }

        tickets.push({
          name: `Over 1.5 Goals Ticket #${tNum}`,
          totalOdds: runningOdds.toFixed(2),
          games: legs
        });
      }

      return tickets;
    }

    function parseStandardTickets(events, dateKey) {
      let parsedGames = events.slice(0, 2).map(ev => parseEvent(ev, dateKey));

      while (parsedGames.length < 2 && parsedGames.length > 0) {
        parsedGames.push(parsedGames[0]);
      }

      return [
        {
          name: "Daily VIP Ticket #1",
          totalOdds: (parseFloat(parsedGames[0].odd) * parseFloat(parsedGames[1].odd)).toFixed(2),
          games: [parsedGames[0], parsedGames[1]]
        }
      ];
    }

    function evaluateGame(pickType, homeScore, awayScore, matchState) {
      if (homeScore === '-' || awayScore === '-' || matchState !== 'post') return null;
      
      const h = parseInt(homeScore);
      const a = parseInt(awayScore);

      if (pickType === "Over 0.5 Goals") {
        return (h + a) > 0;
      }

      switch (pickType) {
        case "Over 1.5 Goals": return (h + a) > 1;
        case "Over 2.5 Goals": return (h + a) > 2;
        case "Home Win (1)": return h > a;
        case "Double Chance (1X)": return h >= a;
        case "Double Chance (X2)": return a >= h;
        default: return true;
      }
    }

    function renderTickets(tickets) {
      const container = document.getElementById("tickets-container");
      container.innerHTML = "";

      tickets.forEach((t) => {
        let ticketStatus = "WIN";
        let hasPending = false;

        for (let g of t.games) {
          const res = evaluateGame(g.pick, g.homeScore, g.awayScore, g.state);
          if (res === null) {
            hasPending = true;
          } else if (res === false) {
            ticketStatus = "LOSS";
          }
        }

        if (hasPending && ticketStatus !== "LOSS") {
          ticketStatus = "PENDING";
        }

        const card = document.createElement("div");
        card.className = "ticket-card";

        card.onclick = () => {
          window.open(adsterraUrl, '_blank');
        };

        card.innerHTML = `
          <div class="ticket-header">
            <div class="ticket-title">⚽ ${t.name}</div>
            <div class="total-odds">Total Odds: ${t.totalOdds}</div>
          </div>
          <div class="games-list">
            ${t.games.map(g => {
              const result = evaluateGame(g.pick, g.homeScore, g.awayScore, g.state);
              let borderCol = 'var(--text-muted)';
              if (result === true) borderCol = 'var(--accent-green)';
              if (result === false) borderCol = 'var(--accent-red)';

              return `
                <div class="game-item" style="border-left-color: ${borderCol};">
                  <div class="game-details">
                    <div class="teams">${g.teams}</div>
                    <div class="league">${g.league} • Pick: <span class="prediction">${g.pick}</span></div>
                  </div>
                  <div class="game-score-box">
                    <div class="score-badge">${g.homeScore === '-' ? 'vs' : g.homeScore + ' - ' + g.awayScore}</div>
                    <div class="game-odds">Odds: ${g.odd}</div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
          <div class="ticket-footer">
            <span style="font-size: 0.8rem; color: var(--text-muted);">Status:</span>
            <span class="status-badge status-${ticketStatus}">${ticketStatus}</span>
          </div>
        `;

        container.appendChild(card);
      });
    }
  </script>
</body>
